<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PLATINUMZ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-2;
    background:linear-gradient(160deg,#0E1A2B 0%,#12263a 50%,#0a1826 100%);
  }
  body::after{
    content:'';
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 20% 20%, rgba(62,211,199,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(242,169,59,0.08), transparent 40%);
  }

  /* ═══════ INTRO SCENE ═══════ */
  .intro-scene{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:row;
    align-items:center;justify-content:center;
    gap:clamp(8px,4vw,80px);
    background:transparent;
    padding:20px;
  }
  .stage{
    position:relative;
    width:min(360px,70vw);
    height:340px;
    flex-shrink:0;
  }
  /* ground line */
  .ground{
    position:absolute;left:10%;right:10%;bottom:26px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(62,211,199,0.5),transparent);
  }
  /* ═══ LAMP SCENE ═══ */
  /* modern tech luminaire that projects light downward */
  .lamp{
    position:absolute;top:6px;left:50%;z-index:4;
    transform:translateX(-50%);
    transform-origin:top center;
    animation:lampSway 3s ease-in-out infinite alternate;
  }
  @keyframes lampSway{from{transform:translateX(-50%) rotate(-2deg);}to{transform:translateX(-50%) rotate(2deg);}}
  /* thin high-tech mounting arm */
  .lamp-arm{
    width:22px;height:54px;margin:0 auto;
    background:linear-gradient(90deg,#333, #555 50%, #222);
    border-radius:4px 4px 0 0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  /* sleek hexagonal/glass luminaire head */
  .lamp-head{
    width:86px;height:34px;background:#1a222e;
    border:1.5px solid rgba(62,195,201,0.55);
    border-radius:14px 14px 4px 4px;position:relative;
    box-shadow:0 0 24px rgba(62,195,201,0.35), inset 0 2px 8px rgba(255,255,255,0.08);
  }
  /* modern LED strip on the bar */
  .lamp-head::before{
    content:'';position:absolute;top:6px;left:8px;right:8px;height:3px;border-radius:6px;
    background:linear-gradient(90deg,rgba(255,244,214,0.2),#0df,rgba(255,244,214,0.2));
    opacity:0.7;
  }
  /* recessed glass lens underneath, diffusing light */
  .lamp-head::after{
    content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    width:52px;height:18px;border-radius:8px;
    background:radial-gradient(ellipse at 50% 40%, #fff8dd, #ffe9a8 55%, rgba(255,217,120,0.3));
    box-shadow:0 0 26px 12px rgba(255,236,190,0.6);
  }
  /* small side status LEDs */
  .lamp-led{
    position:absolute;top:12px;width:6px;height:6px;border-radius:50%;
    background:#3EC3C9;box-shadow:0 0 8px 2px rgba(62,195,201,0.8);
    animation:ledBlink 1.8s ease-in-out infinite alternate;
  }
  .lamp-led.l1{left:10px;}
  .lamp-led.l2{right:10px;animation-delay:0.9s;}
  @keyframes ledBlink{from{opacity:0.3;}to{opacity:1;}}
  /* light cone shining down to the ground (narrow at top, wide at bottom) */
  .light-cone{
    position:absolute;left:50%;top:-18px;width:0;height:0;
    transform:translateX(-50%);
    border-left:95px solid transparent;
    border-right:95px solid transparent;
    border-bottom:240px solid rgba(255,244,214,0.24);
    filter:blur(2px);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  @keyframes lightPulse{from{opacity:0.5;}to{opacity:1;}}
  .light-cone.on{opacity:1;animation:lightPulse 2.6s ease-in-out infinite alternate;}
  /* soft glow pool on the ground */
  .light-pool{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    width:270px;height:36px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,240,200,0.5), transparent 70%);
    opacity:0;
  }
  .light-pool.on{opacity:1;}

  /* ═══ MODERN TECH AMBIENCE ═══ */
  /* subtle animated tech grid + scanline behind the scene */
  .tech-grid{
    position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:18px;
    background-image:
      linear-gradient(rgba(62,195,201,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,195,201,0.07) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
            mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
    animation:gridShift 9s linear infinite;
  }
  @keyframes gridShift{from{background-position:0 0,0 0;}to{background-position:0 26px,26px 0;}}
  /* moving scanline sweep across the stage */
  .scanline{
    position:absolute;left:4%;right:4%;top:0;height:2px;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(62,195,201,0.6),transparent);
    filter:drop-shadow(0 0 6px rgba(62,195,201,0.8));
    animation:scanSweep 4.5s ease-in-out infinite;
  }
  @keyframes scanSweep{0%{top:8%;opacity:0;}15%{opacity:1;}55%{top:86%;}70%{opacity:1;}100%{top:96%;opacity:0;}}
  /* floating energy dust rising from the light pool */
  .sparkle{position:absolute;bottom:20px;width:6px;height:6px;border-radius:50%;z-index:3;pointer-events:none;
    background:radial-gradient(circle at 40% 35%, #fff,#ffd98a 60%);opacity:0;
    animation:rise 3.4s ease-out infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(0.6);opacity:0;}
    12%{opacity:1;}
    100%{transform:translateY(-150px) translateX(var(--drift,0)) scale(1.1);opacity:0;}
  }
  .sparkle.s1{left:34%;--drift:-14px;animation-delay:0s;}
  .sparkle.s2{left:50%;--drift:10px;animation-delay:1.1s;width:8px;height:8px;}
  .sparkle.s3{left:66%;--drift:-8px;animation-delay:2.2s;width:5px;height:5px;}

  /* modern AI/robot head on the ground, looking up at the light */
  .critter{
    position:absolute;left:50%;bottom:24px;width:140px;height:140px;
    transform:translateX(-50%);
    transform-origin:bottom center;
    opacity:0;
  }
  .critter.on{opacity:1;animation:lookUp 1.1s ease-out forwards;}
  @keyframes lookUp{
    0%{ transform:translateY(40%) translateX(-50%) rotate(-3deg) scale(0.9); }
    60%{ transform:translateY(-8%) translateX(-50%) rotate(0) scale(1.03); }
    100%{ transform:translateY(0) translateX(-50%) rotate(0) scale(1); }
  }
  /* rounded modern head shell (dark glass) */
  .c-head{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:108px;height:100px;border-radius:34px;
    background:linear-gradient(180deg,#2a3546,#141b26 70%);
    border:1.5px solid #3EC3C9;
    box-shadow:0 0 0 4px rgba(62,195,201,0.08), 0 0 30px rgba(62,195,201,0.35), inset 0 4px 10px rgba(255,255,255,0.08);
    z-index:2;
    overflow:hidden;
  }
  /* glass reflection shimmer sweeps across the face */
  .c-head::after{
    content:'';position:absolute;top:-40%;left:-60%;width:40%;height:180%;
    background:linear-gradient(105deg,transparent 40%, rgba(255,255,255,0.16) 50%, transparent 62%);
    transform:rotate(12deg);
    animation:shimmer 4s ease-in-out infinite;
  }
  @keyframes shimmer{0%{left:-60%;opacity:0;}20%{opacity:1;}55%{left:120%;}100%{left:120%;opacity:0;}}
  /* glowing energy ring around the head */
  .c-ring{
    position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
    width:150px;height:22px;border-radius:50%;
    border:2px solid rgba(62,195,201,0.6);
    box-shadow:0 0 18px rgba(62,195,201,0.45), inset 0 0 14px rgba(62,195,201,0.3);
    animation:ringPulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes ringPulse{from{transform:translateX(-50%) scaleX(0.9);opacity:0.6;}to{transform:translateX(-50%) scaleX(1.1);opacity:1;}}
  /* subtle top accent glow line */
  .c-head::before{
    content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:60%;height:4px;border-radius:6px;
    background:linear-gradient(90deg,transparent,#3EC3C9,transparent);
  }
  /* antenna */
  .c-ant{
    position:absolute;left:50%;top:-22px;transform:translateX(-50%);
    width:3px;height:20px;background:#3EC3C9;
  }
  .c-ant::after{
    content:'';position:absolute;left:50%;top:-6px;transform:translateX(-50%);
    width:12px;height:12px;border-radius:50%;
    background:#3EC3C9;box-shadow:0 0 14px 4px rgba(62,195,201,0.7);
  }
  /* moving eyes — each is a dark visor slot with a cyan pupil that roams */
  .c-eye{
    position:absolute;top:36px;width:34px;height:26px;
    background:#0b101a;border-radius:14px;
    border:1px solid rgba(62,195,201,0.5);
    overflow:hidden;
  }
  .c-eye-l{left:12px;}
  .c-eye-r{right:12px;}
  .c-eye .pupil{
    position:absolute;left:50%;top:50%;
    width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #7ef0f5,#17a8ad 70%);
    box-shadow:0 0 10px 2px rgba(62,195,201,0.8);
    animation:eyeMove 3.6s ease-in-out infinite;
  }
  /* pupils look up at the light, then roam side to side */
  @keyframes eyeMove{
    0%,18%{ transform:translate(-50%,-50%) translate(0,-6px); }
    22%,34%{ transform:translate(-50%,-50%) translate(-9px,0); }
    38%,50%{ transform:translate(-50%,-50%) translate(9px,2px); }
    54%,66%{ transform:translate(-50%,-50%) translate(0,-7px); }
    70%,100%{ transform:translate(-50%,-50%) translate(4px,-5px); }
  }
  .c-eye-l .pupil{animation-delay:-1.8s;}
  .c-eye-r .pupil{animation-delay:-1.8s;}
  /* mouth — a modern slim glowing line */
  .c-mouth{
    position:absolute;left:50%;top:74px;transform:translateX(-50%);
    width:26px;height:4px;border-radius:6px;
    background:linear-gradient(90deg,transparent,#3EC3C9,transparent);
  }
  /* happy -> mouth becomes a brighter, wider glow */
  .critter.happy .c-mouth{
    width:34px;height:6px;
    box-shadow:0 0 12px 3px rgba(62,195,201,0.7);
    animation:mouthGlow 0.8s ease-in-out infinite alternate;
  }
  @keyframes mouthGlow{from{box-shadow:0 0 8px 2px rgba(62,195,201,0.5);}to{box-shadow:0 0 18px 5px rgba(62,195,201,0.9);}}
  /* chest light strip */
  .c-chest{
    position:absolute;left:50%;top:86px;transform:translateX(-50%);
    width:20px;height:6px;border-radius:6px;
    background:#F2A93B;box-shadow:0 0 12px 2px rgba(242,169,59,0.6);
  }
  .intro-label span{color:#F2A93B;}

  /* ═══════ LOGIN FORM (green + transparent, opens beside the scene) ═══════ */
  .login-form{
    display:flex;flex-direction:column;gap:12px;
    max-width:300px;width:min(300px,80vw);
    padding:20px;
    background:rgba(24,80,42,0.32);
    backdrop-filter:blur(6px);
    border-radius:8px;color:#fff;font-family:Arial;
    border:1px solid rgba(74,222,128,0.45);
    box-shadow:0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(34,197,94,0.25);
    z-index:10;
    position:relative;
    opacity:0;visibility:hidden;
    transform:translateX(30px) scale(0.95);
    transition:opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
  }
  .login-form.open{
    opacity:1;visibility:visible;
    transform:translateX(0) scale(1);
  }
  .login-form-title{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:2px;font-family:'Space Grotesk',sans-serif;}
  input,button{padding:10px;border:none;border-radius:5px;}
  input{background:rgba(20,60,32,0.45);color:#fff;border:1px solid rgba(74,222,128,0.35);outline:none;}
  input::placeholder{color:rgba(220,255,230,0.55);}
  input:focus{border-color:#4ade80;box-shadow:0 0 10px rgba(74,222,128,0.3);}
  button{background:rgba(34,197,94,0.45);color:#fff;cursor:pointer;font-weight:600;border:1px solid rgba(134,239,172,0.5);backdrop-filter:blur(4px);}
  button:hover{background:rgba(34,197,94,0.7);}
  button:disabled{opacity:0.6;cursor:wait;}
  .error{color:#ff6b6b;font-size:0.82rem;display:none;text-align:center;}
  .signup{font-size:0.82rem;text-align:center;color:rgba(220,255,230,0.7);}
  .signup a{color:#4ade80;text-decoration:none;font-weight:600;}
  .role-tag{
    text-align:center;font-size:0.72rem;color:#a7f3d0;
    background:rgba(34,197,94,0.18);padding:4px 10px;border-radius:12px;
    margin-bottom:6px;display:inline-block;align-self:center;
  }

  /* ═══ RESPONSIVE : works on phones + computers ═══ */
  @media (max-width:900px){
    /* stack form below the scene instead of beside it */
    .intro-scene{flex-direction:column;gap:4px;align-items:center;justify-content:flex-start;overflow-y:auto;padding:16px 12px 40px;}
    .stage{width:min(320px,92vw);height:300px;}
    .login-form{max-width:min(320px,88vw);width:min(320px,88vw);}
    .login-form.open{transform:translateX(0) scale(1);}
  }
  @media (max-width:480px){
    .stage{width:min(300px,94vw);height:290px;}
    .critter{transform:scale(0.85) translateX(-58%);transform-origin:bottom center;}
    .critter.on{animation:lookUpMobile 1.1s ease-out forwards;}
    @keyframes lookUpMobile{
      0%{transform:translateY(40%) translateX(-58%) rotate(-3deg) scale(0.85);}
      60%{transform:translateY(-8%) translateX(-58%) rotate(0) scale(0.88);}
      100%{transform:translateY(0) translateX(-58%) rotate(0) scale(0.85);}
    }
    .lamp{transform:translateX(-50%) scale(0.85);}
  }
</style>
</head>
<body>

<!-- INTRO SCENE: modern tech lamp shines light down, a modern AI head with moving eyes looks up, form opens -->
<div class="intro-scene" id="introScene">
  <div class="stage">
    <div class="tech-grid"></div>
    <div class="scanline"></div>
    <div class="light-cone" id="lightCone"></div>
    <div class="light-pool" id="lightPool"></div>
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="lamp">
      <div class="lamp-arm"></div>
      <div class="lamp-head">
        <div class="lamp-led l1"></div>
        <div class="lamp-led l2"></div>
      </div>
    </div>
    <div class="critter" id="critter">
      <div class="c-ring"></div>
      <div class="c-ant"></div>
      <div class="c-head">
        <div class="c-eye c-eye-l"><div class="pupil"></div></div>
        <div class="c-eye c-eye-r"><div class="pupil"></div></div>
        <div class="c-mouth"></div>
        <div class="c-chest"></div>
      </div>
    </div>
  </div>

  <!-- LOGIN FORM (opens beside the scene) -->
  <form class="login-form" id="loginForm" style="align-self:center;">
    <span class="role-tag">PLATINUMZ IT Support</span>
    <div class="login-form-title">Login</div>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <div class="error" id="loginError"></div>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBPhpL4O8Zfy7InnfKL8neM7hM7sBUQdWY",
  authDomain: "platinumz--it-support.firebaseapp.com",
  projectId: "platinumz--it-support",
  storageBucket: "platinumz--it-support.firebasestorage.app",
  messagingSenderId: "753254762964",
  appId: "1:753254762964:web:e7ee9436a48d3274c42e41"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
var db = firebase.firestore();
var ADMIN_EMAIL = 'paulleonard277@gmail.com';
var _adminRoleCache = {};

function _isAdmin(user){
  if(!user) return false;
  if(user.email === ADMIN_EMAIL) return true;
  return !!_adminRoleCache[user.uid];
}
function _checkAdminRole(user){
  return db.collection('clients').doc(user.uid).get().then(function(doc){
    if(doc.exists && doc.data().role === 'admin'){
      _adminRoleCache[user.uid] = true;
      return true;
    }
    return false;
  }).catch(function(){ return false; });
}
function _route(user){
  _checkAdminRole(user).then(function(){
    window.location.href = _isAdmin(user) ? 'admin.html' : 'customer.html';
  }).catch(function(){
    window.location.href = 'customer.html';
  });
}

/* If already logged in, route immediately (no need for animation) */
auth.onAuthStateChanged(function(user){
  if(user){ _route(user); }
});

/* Intro sequence: lamp lights up -> cone shines down -> modern AI head looks up (eyes moving) -> form opens */
var formOpened = false;
function openLoginForm(){
  if(formOpened) return;
  formOpened = true;
  var form = document.getElementById('loginForm');
  form.classList.add('open');
}

/* timeline:
   1) lamp turns on, light cone + pool fade in (0 -> 0.9s)
   2) AI head appears and looks up at the light; eyes keep moving (0.6 -> 1.8s)
   3) head gets happy, then the registration form opens (2.1s) */
window.addEventListener('load', function(){
  var cone = document.getElementById('lightCone');
  var pool = document.getElementById('lightPool');
  var critter = document.getElementById('critter');
  setTimeout(function(){ cone.classList.add('on'); pool.classList.add('on'); }, 150);
  setTimeout(function(){ critter.classList.add('on'); }, 650);
  setTimeout(function(){ critter.classList.add('happy'); }, 1700);
  setTimeout(openLoginForm, 2100);
});
/* fallback: also trigger if animations are disabled/slow */
setTimeout(openLoginForm, 2800);

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.textContent = 'Logging in...';
  btn.disabled = true;
  auth.signInWithEmailAndPassword(email, pass).then(function(){
    /* routed by onAuthStateChanged */
  }).catch(function(error){
    btn.textContent = 'Login';
    btn.disabled = false;
    var msg = 'Something went wrong.';
    if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') msg='Email or password is incorrect.';
    err.textContent = msg;
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
