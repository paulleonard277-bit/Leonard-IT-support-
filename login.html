<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PLATINUMZ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05070a;
    font-family:Arial,sans-serif;
    overflow:auto;
    padding:24px 16px;
  }
  /* soft ambient background glows */
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(700px 500px at 15% 10%, rgba(43,227,168,0.10), transparent 55%),
      radial-gradient(700px 520px at 90% 100%, rgba(29,233,168,0.08), transparent 55%),
      linear-gradient(160deg,#05070a,#081712 60%,#05080a);
  }
  body::after{
    content:'';
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(circle at 20% 20%, rgba(43,227,168,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(242,169,59,0.06), transparent 40%);
    animation:bgShift 14s ease-in-out infinite alternate;
  }
  @keyframes bgShift{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    50%{ filter:hue-rotate(16deg) brightness(1.05); }
    100%{ filter:hue-rotate(-16deg) brightness(1); }
  }
  /* twinkling tech speckle field */
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .ambient i{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #eafff6, rgba(43,227,168,0.7) 60%);
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:0.12;transform:scale(0.7);}50%{opacity:1;transform:scale(1.25);}}

  /* ═══════ LOGIN CARD ═══════ */
  .login-container{
    position:relative;
    padding:40px 34px 36px;
    background:linear-gradient(180deg,#0f3d34,#0a1f1c 70%);
    border-radius:20px;
    width:min(560px,94vw);
    color:#fff;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 50px rgba(43,227,168,0.10);
    animation:fadeIn 0.9s ease;
    overflow:hidden;
    z-index:5;
    border:1px solid rgba(43,227,168,0.22);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(30px) scale(0.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* side-by-side layout: robot left, form right */
  .login-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
  }
  .form-side{
    flex:1 1 auto;
    max-width:300px;
    width:100%;
    text-align:center;
  }

  /* spotlight cone shining down from top */
  .spotlight{
    position:absolute;
    top:-40px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:180px solid rgba(120,255,210,0.14);
    filter:blur(2px);
    animation:flicker 3.2s infinite ease-in-out;
    pointer-events:none;
  }
  @keyframes flicker{
    0%,100%{opacity:0.6;}
    50%{opacity:0.95;}
  }

  /* ═══════ ROBOT HEAD (with headphones + top light) ═══════ */
  .robot-head{
    position:relative;
    flex:0 0 auto;
    width:104px; height:104px;
    margin:8px auto;
    background:radial-gradient(circle at 50% 40%, #143a33, #0b1f1c 80%);
    border:3px solid #2be3a8;
    border-radius:50%;
    box-shadow:0 0 26px rgba(43,227,168,0.6), inset 0 0 20px rgba(43,227,168,0.25);
    animation:glow 2s infinite;
    z-index:2;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 26px rgba(43,227,168,0.5), inset 0 0 20px rgba(43,227,168,0.2);}
    50%{box-shadow:0 0 48px rgba(43,227,168,0.95), inset 0 0 26px rgba(43,227,168,0.4);}
  }

  /* headphone headband arching over the top of the head */
  .headband{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    width:96px; height:58px;
    border-top:6px solid #1de9a8;
    border-radius:60px 60px 0 0;
    box-shadow:0 0 12px rgba(29,233,168,0.5);
    z-index:3;
    pointer-events:none;
  }

  /* headphone ear cups on both sides */
  .ear{
    position:absolute;
    top:28px;
    width:26px; height:44px;
    background:linear-gradient(45deg,#1de9a8,#0fbf82);
    border-radius:40%;
    box-shadow:0 0 14px rgba(29,233,168,0.75);
    z-index:3;
  }
  .ear.left{right:100%; margin-right:-10px;}
  .ear.right{left:100%; margin-left:-10px;}

  /* triangle light beam shining down below the robot head, sweeping left-right */
  .under-light{
    position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:46px solid transparent;
    border-right:46px solid transparent;
    border-top:52px solid rgba(140,255,215,0.22);
    filter:blur(2px);
    z-index:1;
    pointer-events:none;
    transform-origin:50% 0%;
    animation:sweep 4.5s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{transform:translate(-50%,0) rotate(-14deg);}
    50%{transform:translate(-50%,0) rotate(14deg);}
  }

  /* modern glowing light sitting above the heading */
  .heading-light{
    position:relative;
    width:0; height:0;
    margin:0 auto 10px;
  }
  .heading-light::before{
    content:'';
    position:absolute;
    bottom:-12px; left:50%;
    transform:translateX(-50%);
    width:16px; height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #fff3a3 55%, rgba(255,230,120,0.2));
    border:2px solid rgba(255,255,255,0.9);
    animation:headingGlow 2.2s infinite ease-in-out;
  }
  .heading-light::after{
    content:'';
    position:absolute;
    bottom:-2px; left:50%;
    transform:translateX(-50%);
    width:4px; height:10px;
    background:#1de9a8;
    border-radius:2px;
  }
  @keyframes headingGlow{
    0%,100%{box-shadow:0 0 22px 8px rgba(255,240,150,0.9), 0 0 44px 16px rgba(255,220,90,0.4);}
    50%{box-shadow:0 0 34px 14px rgba(255,255,255,1), 0 0 60px 24px rgba(255,230,120,0.7);}
  }

  .eye{
    position:absolute;
    top:40px;
    width:14px; height:14px;
    background:#eafff6;
    border-radius:50%;
    box-shadow:0 0 10px 3px rgba(43,227,168,0.9);
    animation:blink 4s infinite;
  }
  .eye.left{left:22px;}
  .eye.right{right:22px;}
  @keyframes blink{0%,94%,100%{transform:scaleY(1);} 96%{transform:scaleY(0.1);} 98%{transform:scaleY(1);}}
  .mouth{
    position:absolute;
    bottom:24px; left:50%;
    transform:translateX(-50%);
    width:36px; height:16px;
    border-bottom:3px solid #eafff6;
    border-radius:0 0 22px 22px;
    box-shadow:0 2px 8px rgba(43,227,168,0.6);
  }

  /* mobile: stack robot above form */
  @media (max-width:520px){
    .login-row{flex-direction:column; gap:10px;}
    .login-container{padding:30px 20px 26px;}
  }

  .role-tag{
    display:inline-block;
    font-size:0.68rem;color:#a7f3d0;letter-spacing:0.5px;
    background:rgba(43,227,168,0.14);border:1px solid rgba(43,227,168,0.25);
    padding:4px 12px;border-radius:20px;margin-bottom:12px;font-weight:600;
  }
  h2{margin:0 0 4px; font-size:1.35rem; font-weight:700; font-family:Georgia,serif;}
  .card-sub{margin:0 0 18px; font-size:0.78rem; color:#7fa89c;}

  input{
    width:92%; box-sizing:border-box;
    padding:12px; margin:8px 0;
    border:none; border-radius:8px;
    background:#0f2621; color:#fff; outline:none;
    font-size:0.95rem;
    border:1px solid rgba(43,227,168,0.12);
    transition:border-color 0.3s, box-shadow 0.3s;
  }
  input::placeholder{color:#7fa89c;}
  input:focus{border-color:#2be3a8;box-shadow:0 0 12px rgba(43,227,168,0.25);}

  /* signup-only fields hidden in login mode */
  #loginName,#loginPass2{display:none;animation:fieldIn 0.35s ease;}
  .login-container.signup-mode #loginName,.login-container.signup-mode #loginPass2{display:block;}
  @keyframes fieldIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  button{
    width:96%; padding:12px; margin:12px 0 4px;
    background:linear-gradient(45deg,#1de9a8,#0fbf82);
    border:none; color:#04241c; font-weight:bold;
    border-radius:8px; cursor:pointer; font-size:0.95rem;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover{transform:scale(1.03); box-shadow:0 0 22px #1de9a8;}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.6;cursor:wait;transform:none;}

  .error{color:#ff6b6b;font-size:0.82rem;display:none;text-align:center;margin-top:8px;}
  .signup{font-size:0.82rem;text-align:center;color:#7fa89c;margin-top:12px;}
  .signup a{color:#2be3a8;text-decoration:none;font-weight:600;cursor:pointer;}
  .signup a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div class="login-container" id="loginFormWrap">
  <div class="spotlight"></div>
  <div class="login-row">
    <div class="robot-head">
      <div class="under-light"></div>
      <div class="headband"></div>
      <div class="ear right"></div>
      <div class="ear left"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>

    <div class="form-side">
      <div class="heading-light"></div>
      <span class="role-tag">PLATINUMZ IT Support</span>
      <h2 id="cardTitle">Welcome Back</h2>
      <p class="card-sub" id="cardSub">Ingia kwenye akaunti yako</p>

      <form id="loginForm">
        <input type="text" id="loginName" placeholder="Jina lako (kwa kujisajili)" autocomplete="name">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPass" placeholder="Password" required>
        <input type="password" id="loginPass2" placeholder="Rudia Password" autocomplete="new-password">
        <div class="error" id="loginError"></div>
        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p class="signup" id="switchModeText">Huna akaunti? <a id="switchModeLink">Jisajili hapa</a></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBPhpL4O8Zfy7InnfKL8neM7hM7sBUQdWY",
  authDomain: "platinumz--it-support.firebaseapp.com",
  projectId: "platinumz--it-support",
  storageBucket: "platinumz--it-support.firebasestorage.app",
  messagingSenderId: "753254762964",
  appId: "1:753254762964:web:e7ee9436a48d3274c42e41"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
var db = firebase.firestore();
var ADMIN_EMAIL = 'paulleonard277@gmail.com';
var _adminRoleCache = {};

function _isAdmin(user){
  if(!user) return false;
  if(user.email === ADMIN_EMAIL) return true;
  return !!_adminRoleCache[user.uid];
}
function _checkAdminRole(user){
  return db.collection('clients').doc(user.uid).get().then(function(doc){
    if(doc.exists && doc.data().role === 'admin'){
      _adminRoleCache[user.uid] = true;
      return true;
    }
    return false;
  }).catch(function(){ return false; });
}
function _route(user){
  _checkAdminRole(user).then(function(){
    window.location.href = _isAdmin(user) ? 'admin.html' : 'customer.html';
  }).catch(function(){
    window.location.href = 'customer.html';
  });
}

/* If already logged in, route immediately */
auth.onAuthStateChanged(function(user){
  if(user){ _route(user); }
});

/* generate twinkling speckles */
(function(){
  var amb = document.getElementById('ambient');
  if(!amb) return;
  var n = (window.innerWidth < 480) ? 26 : 46;
  for(var k=0;k<n;k++){
    var i = document.createElement('i');
    var s = (Math.random()*3+1).toFixed(1);
    i.style.width = s+'px';
    i.style.height = s+'px';
    i.style.left = (Math.random()*100)+'%';
    i.style.top = (Math.random()*100)+'%';
    i.style.animationDelay = (Math.random()*5)+'s';
    i.style.animationDuration = (Math.random()*3+3.2).toFixed(2)+'s';
    amb.appendChild(i);
  }
})();

/* switch between Login and Signup modes */
var authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  var wrap = document.getElementById('loginFormWrap');
  var title = document.getElementById('cardTitle');
  var sub = document.getElementById('cardSub');
  var btn = document.getElementById('loginBtn');
  var sw = document.getElementById('switchModeText');
  var err = document.getElementById('loginError');
  err.style.display = 'none';
  if(mode === 'signup'){
    wrap.classList.add('signup-mode');
    title.textContent = 'Jisajili';
    sub.textContent = 'Fungua akaunti mpya';
    btn.textContent = 'Jisajili';
    sw.innerHTML = 'Una akaunti? <a id="switchModeLink">Ingia</a>';
  } else {
    wrap.classList.remove('signup-mode');
    title.textContent = 'Welcome Back';
    sub.textContent = 'Ingia kwenye akaunti yako';
    btn.textContent = 'Login';
    sw.innerHTML = 'Huna akaunti? <a id="switchModeLink">Jisajili hapa</a>';
  }
  document.getElementById('switchModeLink').addEventListener('click', function(){
    setAuthMode(authMode === 'login' ? 'signup' : 'login');
  });
}

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var name = document.getElementById('loginName').value.trim();
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.disabled = true;

  var action;
  if(authMode === 'signup'){
    var pass2 = document.getElementById('loginPass2').value;
    if(pass.length < 6){
      err.textContent = 'Password lazima iwe angalau herufi 6.';
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
    if(pass !== pass2){
      err.textContent = 'Password hazifanani.';
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
    btn.textContent = 'Inajisajili...';
    action = auth.createUserWithEmailAndPassword(email, pass);
  } else {
    btn.textContent = 'Inaingia...';
    action = auth.signInWithEmailAndPassword(email, pass);
  }

  action.then(function(result){
    if(authMode === 'signup' && result.user){
      var tasks = [];
      if(name) tasks.push(result.user.updateProfile({ displayName: name }));
      tasks.push(db.collection('clients').doc(result.user.uid).set({
        jina: name || '',
        email: email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }));
      tasks.push(result.user.sendEmailVerification());
      return Promise.all(tasks);
    }
    return null;
  }).then(function(){
    /* routed by onAuthStateChanged */
  }).catch(function(error){
    btn.textContent = authMode === 'signup' ? 'Jisajili' : 'Login';
    btn.disabled = false;
    var msg = 'Something went wrong.';
    if(error.code==='auth/email-already-in-use') msg='Email hii tayari imetumika.';
    else if(error.code==='auth/invalid-email') msg='Email si sahihi.';
    else if(error.code==='auth/weak-password') msg='Password ni dhaifu sana.';
    else if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') msg='Email au password si sahihi.';
    err.textContent = msg;
    err.style.display = 'block';
  });
});

setAuthMode('login');
</script>
</body>
</html>
