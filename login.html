<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PLATINUMZ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-2;
    background:linear-gradient(160deg,#0E1A2B 0%,#12263a 50%,#0a1826 100%);
  }
  body::after{
    content:'';
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 20% 20%, rgba(62,211,199,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(242,169,59,0.08), transparent 40%);
  }

  /* ═══════ INTRO SCENE ═══════ */
  .intro-scene{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:row;
    align-items:center;justify-content:center;
    gap:clamp(8px,4vw,80px);
    background:transparent;
    padding:20px;
  }
  .stage{
    position:relative;
    width:min(360px,70vw);
    height:340px;
    flex-shrink:0;
  }
  /* ground line */
  .ground{
    position:absolute;left:10%;right:10%;bottom:26px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(62,211,199,0.5),transparent);
  }
  /* ═══ LAMP SCENE ═══ */
  /* suspended hanging lamp that shines light downward */
  .lamp{
    position:absolute;top:10px;left:50%;
    transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
    transform-origin:top center;
    animation:lampSway 3s ease-in-out infinite alternate;
  }
  @keyframes lampSway{from{transform:translateX(-50%) rotate(-3deg);}to{transform:translateX(-50%) rotate(3deg);}}
  .lamp-cord{
    width:3px;height:70px;background:linear-gradient(#444,#222);
    box-shadow:0 0 6px rgba(0,0,0,0.5);
  }
  .lamp-head{
    width:34px;height:22px;background:radial-gradient(circle at 50% 0%, #3a3a42,#15151b);
    border-radius:4px 4px 6px 6px;position:relative;
    box-shadow:inset 0 2px 4px rgba(255,255,255,0.15), 0 0 20px 6px rgba(255,244,214,0.55);
  }
  .lamp-head::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    width:20px;height:10px;border-radius:0 0 50% 50%;
    background:#ffd98a;
    box-shadow:0 0 18px 6px rgba(255,214,130,0.8);
  }
  /* light cone shining down to the ground */
  .light-cone{
    position:absolute;left:50%;top:0;width:0;height:0;
    transform:translateX(-50%);
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-top:210px solid rgba(255,236,190,0.28);
    filter:blur(2px);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  @keyframes lightPulse{from{opacity:0.55;}to{opacity:1;}}
  .light-cone.on{opacity:1;animation:lightPulse 2.6s ease-in-out infinite alternate;}
  /* soft glow pool on the ground */
  .light-pool{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    width:260px;height:34px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,236,190,0.5), transparent 70%);
    opacity:0;
  }
  .light-pool.on{opacity:1;}

  /* small green head with big ears on the ground, looking up at the light */
  .critter{
    position:absolute;left:50%;bottom:24px;width:120px;height:120px;
    transform:translateX(-50%);
    transform-origin:bottom center;
    opacity:0;
  }
  .critter.on{opacity:1;animation:lookUp 1.1s ease-out forwards;}
  @keyframes lookUp{
    0%{ transform:translateY(40%) translateX(-50%) rotate(0); }
    100%{ transform:translateY(0) translateX(-50%) rotate(-2deg); }
  }
  /* big ears on top of the head */
  .c-ear{
    position:absolute;top:0;width:34px;height:52px;border-radius:50% 50% 8px 8px;
    background:radial-gradient(circle at 50% 20%, #7BD14E,#3e8e2e 75%);
    border:2px solid #2a6b1f;
    z-index:1;
  }
  .c-ear::after{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:16px;height:34px;border-radius:50%;background:#f2b8a6;}
  .c-ear-l{left:2px;transform:rotate(-14deg);}
  .c-ear-r{right:2px;transform:rotate(14deg);}
  /* green head */
  .c-head{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:96px;height:86px;border-radius:46% 46% 42% 42% / 60% 60% 42% 42%;
    background:radial-gradient(circle at 40% 34%, #8fd95c,#4aa534 72%);
    box-shadow:inset -8px -6px 0 rgba(20,70,10,0.25);
  }
  /* eyes looking UP (pupils toward the top) */
  .c-eye{
    position:absolute;top:28px;width:26px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 50% 30%, #fff 0 55%, #ffe98a 60% 100%);
    border:2px solid #1c3a12;
  }
  .c-eye .pupil{
    position:absolute;left:50%;top:3px;transform:translateX(-50%);
    width:10px;height:13px;border-radius:50%;
    background:#1c3a12;
  }
  .c-eye-l{left:12px;}
  .c-eye-r{right:12px;}
  /* downward (neutral) mouth */
  .c-mouth{
    position:absolute;left:50%;top:58px;transform:translateX(-50%);
    width:16px;height:10px;border-bottom:3px solid #1c3a12;border-radius:0 0 60% 60%;
  }
  /* upward (happy smile) when it sees the light */
  .critter.happy .c-mouth{
    border-bottom:none;border-top:3px solid #1c3a12;border-radius:60% 60% 0 0;
  }
  .c-nose{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:12px;height:9px;border-radius:50%;background:#2a6b1f;}
  .intro-label span{color:#F2A93B;}

  /* ═══════ LOGIN FORM (opens beside the scene) ═══════ */
  .login-form{
    display:flex;flex-direction:column;gap:12px;
    max-width:300px;width:min(300px,80vw);
    padding:20px;
    background:rgba(16,16,20,0.6);
    backdrop-filter:blur(6px);
    border-radius:8px;color:#fff;font-family:Arial;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    z-index:10;
    position:relative;
    opacity:0;visibility:hidden;
    transform:translateX(30px) scale(0.95);
    transition:opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
  }
  .login-form.open{
    opacity:1;visibility:visible;
    transform:translateX(0) scale(1);
  }
  .login-form-title{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:2px;font-family:'Space Grotesk',sans-serif;}
  input,button{padding:10px;border:none;border-radius:5px;}
  input{background:rgba(34,34,38,0.8);color:#fff;border:1px solid #333;outline:none;}
  input:focus{border-color:#F2A93B;}
  button{background:#007bff;color:#fff;cursor:pointer;font-weight:600;}
  button:hover{background:#0056b3;}
  button:disabled{opacity:0.6;cursor:wait;}
  .error{color:#ff6b6b;font-size:0.82rem;display:none;text-align:center;}
  .signup{font-size:0.82rem;text-align:center;color:#888;}
  .signup a{color:#F2A93B;text-decoration:none;font-weight:600;}
  .role-tag{
    text-align:center;font-size:0.72rem;color:#7ec9c2;
    background:rgba(62,211,199,0.1);padding:4px 10px;border-radius:12px;
    margin-bottom:6px;display:inline-block;align-self:center;
  }

  @media (max-width:680px){
    /* stack form below the scene on small screens */
    .intro-scene{flex-direction:column;gap:6px;overflow-y:auto;}
    .stage{width:min(300px,86vw);height:280px;}
    .login-form.open{transform:translateX(0) scale(1);}
  }
</style>
</head>
<body>

<!-- INTRO SCENE: lamp shines light down, a green critter with big ears looks up, form opens -->
<div class="intro-scene" id="introScene">
  <div class="stage">
    <div class="light-cone" id="lightCone"></div>
    <div class="light-pool" id="lightPool"></div>
    <div class="lamp">
      <div class="lamp-cord"></div>
      <div class="lamp-head"></div>
    </div>
    <div class="critter" id="critter">
      <div class="c-ear c-ear-l"></div>
      <div class="c-ear c-ear-r"></div>
      <div class="c-head">
        <div class="c-eye c-eye-l"><div class="pupil"></div></div>
        <div class="c-eye c-eye-r"><div class="pupil"></div></div>
        <div class="c-nose"></div>
        <div class="c-mouth"></div>
      </div>
    </div>
  </div>

  <!-- LOGIN FORM (opens beside the scene) -->
  <form class="login-form" id="loginForm" style="align-self:center;">
    <span class="role-tag">PLATINUMZ IT Support</span>
    <div class="login-form-title">Login</div>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <div class="error" id="loginError"></div>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBPhpL4O8Zfy7InnfKL8neM7hM7sBUQdWY",
  authDomain: "platinumz--it-support.firebaseapp.com",
  projectId: "platinumz--it-support",
  storageBucket: "platinumz--it-support.firebasestorage.app",
  messagingSenderId: "753254762964",
  appId: "1:753254762964:web:e7ee9436a48d3274c42e41"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
var db = firebase.firestore();
var ADMIN_EMAIL = 'paulleonard277@gmail.com';
var _adminRoleCache = {};

function _isAdmin(user){
  if(!user) return false;
  if(user.email === ADMIN_EMAIL) return true;
  return !!_adminRoleCache[user.uid];
}
function _checkAdminRole(user){
  return db.collection('clients').doc(user.uid).get().then(function(doc){
    if(doc.exists && doc.data().role === 'admin'){
      _adminRoleCache[user.uid] = true;
      return true;
    }
    return false;
  }).catch(function(){ return false; });
}
function _route(user){
  _checkAdminRole(user).then(function(){
    window.location.href = _isAdmin(user) ? 'admin.html' : 'customer.html';
  }).catch(function(){
    window.location.href = 'customer.html';
  });
}

/* If already logged in, route immediately (no need for animation) */
auth.onAuthStateChanged(function(user){
  if(user){ _route(user); }
});

/* Intro sequence: lamp lights up -> cone shines down -> green critter looks up -> form opens */
var formOpened = false;
function openLoginForm(){
  if(formOpened) return;
  formOpened = true;
  var form = document.getElementById('loginForm');
  form.classList.add('open');
}

/* timeline:
   1) lamp turns on, light cone + pool fade in (0 -> 0.9s)
   2) critter head appears and looks up at the light (0.6 -> 1.8s)
   3) critter smiles, then the registration form opens (2.1s) */
window.addEventListener('load', function(){
  var cone = document.getElementById('lightCone');
  var pool = document.getElementById('lightPool');
  var critter = document.getElementById('critter');
  setTimeout(function(){ cone.classList.add('on'); pool.classList.add('on'); }, 150);
  setTimeout(function(){ critter.classList.add('on'); }, 650);
  setTimeout(function(){ critter.classList.add('happy'); }, 1700);
  setTimeout(openLoginForm, 2100);
});
/* fallback: also trigger if animations are disabled/slow */
setTimeout(openLoginForm, 2800);

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.textContent = 'Logging in...';
  btn.disabled = true;
  auth.signInWithEmailAndPassword(email, pass).then(function(){
    /* routed by onAuthStateChanged */
  }).catch(function(error){
    btn.textContent = 'Login';
    btn.disabled = false;
    var msg = 'Something went wrong.';
    if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') msg='Email or password is incorrect.';
    err.textContent = msg;
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
