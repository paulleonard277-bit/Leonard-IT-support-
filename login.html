<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PLATINUMZ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-2;
    background:linear-gradient(160deg,#0E1A2B 0%,#12263a 50%,#0a1826 100%);
  }
  body::after{
    content:'';
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 20% 20%, rgba(62,211,199,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(242,169,59,0.08), transparent 40%);
  }

  /* ═══════ INTRO SCENE ═══════ */
  .intro-scene{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:row;
    align-items:center;justify-content:center;
    gap:clamp(8px,4vw,80px);
    background:transparent;
    padding:20px;
  }
  .stage{
    position:relative;
    width:min(360px,70vw);
    height:340px;
    flex-shrink:0;
  }
  /* ground line */
  .ground{
    position:absolute;left:10%;right:10%;bottom:26px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(62,211,199,0.5),transparent);
  }
  /* ═══ SONIC-STYLE CHARACTER (bright blue, spikes, spins his legs to run) ═══ */
  .person{
    position:absolute;bottom:28px;left:50%;
    width:170px;height:190px;
    transform:translateX(-50%);
    animation:personWalk 2.2s ease-in forwards;
  }
  @keyframes personWalk{
    0%{ transform:translateX(calc(-50% - 70vw)) rotate(-12deg); }
    30%{ transform:translateX(calc(-50% - 40vw)) rotate(-12deg); }
    60%{ transform:translateX(calc(-50% + 6vw)) rotate(-12deg) translateY(3px); }
    100%{ transform:translateX(-50%) rotate(-12deg) translateY(0); }
  }

  /* ═══ SPIN BALL (Sonic curls into a ball to start running) ═══ */
  .person.spin { animation:sonicSpin 0.7s cubic-bezier(.5,.1,.4,1) forwards; }
  @keyframes sonicSpin{
    0%{ transform:translateX(calc(-50% - 70vw)) rotate(-12deg); }
    100%{ transform:translateX(calc(-50% - 12vw)) rotate(720deg); }
  }
  .spin .p-head,.spin .p-body,.spin .p-arm,.spin .p-leg,.spin .p-belly-hip,.spin .bag{ visibility:hidden; }
  .spin-ball{
    position:absolute;left:50%;top:50%;width:74px;height:74px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 34%, #5A8BFF, #2351e0 60%);
    border-radius:50%;display:none;
    box-shadow:inset -10px -8px 0 rgba(0,20,90,0.25);
    z-index:3;
  }
  .person.spin .spin-ball{ display:block; }
  .spin-ball .hair{position:absolute;left:-8px;top:-8px;width:30px;height:22px;background:#2351e0;border-radius:50% 8px 8px 50%;transform:rotate(20deg);}

  /* spikes (bright blue) at the back of the head */
  .p-spike{
    position:absolute;left:4px;top:-6px;width:28px;height:28px;background:#2351e0;
    transform:rotate(30deg);border-radius:4px 8px 2px 8px;
  }
  .p-spike.s2{left:-14px;top:6px;transform:rotate(58deg);width:32px;height:24px;}
  .p-spike.s3{left:-32px;top:22px;transform:rotate(78deg);width:36px;height:22px;}

  /* large Sonic head (bright blue) with face */
  .p-head{
    position:absolute;left:40px;bottom:108px;width:96px;height:82px;border-radius:46% 46% 42% 42% / 55% 55% 40% 40%;
    background:radial-gradient(circle at 38% 34%, #5A8BFF, #2351e0 70%);
    box-shadow:inset -9px -7px 0 rgba(0,20,90,0.25);
    z-index:2;
  }
  /* Sonic muzzle (cream/peach snout) */
  .p-head::before{
    content:'';position:absolute;left:30px;bottom:0;width:52px;height:34px;border-radius:22px 22px 14px 14px;
    background:#f6d8bb;
  }
  /* Sonic nose (black) */
  .p-nose{
    position:absolute;left:60px;bottom:14px;width:14px;height:10px;border-radius:50%;
    background:#111118;z-index:3;
  }
  /* eyes (big green) */
  .p-eye{
    position:absolute;top:24px;width:17px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #0faa5a,#066f3f 70%);border:2px solid #111118;
  }
  .p-eye-l{left:22px;}
  .p-eye-r{right:20px;}

  /* blue body */
  .p-body{
    position:absolute;left:54px;bottom:48px;width:62px;height:56px;border-radius:16px 16px 10px 10px;
    background:linear-gradient(180deg,#5A8BFF,#2351e0);
    box-shadow:inset 0 -9px 0 rgba(0,20,90,0.2);
  }
  /* belly (cream) */
  .p-belly-hip{position:absolute;left:52px;bottom:32px;width:66px;height:26px;border-radius:10px;background:#f6d8bb;}

  /* legs — spin 360° like Sonic running wheels */
  .p-leg{
    position:absolute;bottom:0;width:16px;height:28px;
    transform-origin:top;border-radius:6px;background:#2351e0;
  }
  .p-leg .shoe{position:absolute;bottom:-4px;left:-5px;width:28px;height:15px;border-radius:6px 2px 6px 4px;background:#d62828;border:1px solid #8f1a1a;}
  .p-leg-l{left:60px;animation:legSpinL 0.5s linear infinite;transform-origin:55% 0%;}
  .p-leg-r{right:34px;animation:legSpinR 0.5s linear infinite;transform-origin:55% 0%;}
  @keyframes legSpinL{
    0%{ transform:rotate(0deg) translateX(2px); }
    25%{ transform:rotate(90deg) translateX(2px); }
    50%{ transform:rotate(180deg) translateX(2px); }
    75%{ transform:rotate(270deg) translateX(2px); }
    100%{ transform:rotate(360deg) translateX(2px); }
  }
  @keyframes legSpinR{
    0%{ transform:rotate(360deg) translateX(-2px); }
    25%{ transform:rotate(270deg) translateX(-2px); }
    50%{ transform:rotate(180deg) translateX(-2px); }
    75%{ transform:rotate(90deg) translateX(-2px); }
    100%{ transform:rotate(0deg) translateX(-2px); }
  }
  /* legs stop after the run */
  .stop .p-leg-l{animation:none;transform:rotate(0);}
  .stop .p-leg-r{animation:none;transform:rotate(0);}

  /* arms */
  .p-arm{position:absolute;top:104px;width:12px;height:36px;background:#2351e0;border-radius:6px;transform-origin:top;}
  .p-arm-l{left:54px;animation:armSwingL 0.5s linear infinite;}
  .p-arm-r{right:34px;}
  /* free arm swings, bag arm steady */
  @keyframes armSwingL{0%,100%{transform:rotate(-28deg);}50%{transform:rotate(6deg);}}
  /* arms raise up after bag placed */
  .raise .p-arm-l{animation:armUpL 0.6s ease-out 0.2s forwards;}
  .raise .p-arm-r{animation:armUpR 0.6s ease-out 0.2s forwards;}
  @keyframes armUpL{0%{transform:rotate(0) translateY(0);}100%{transform:rotate(152deg) translateY(-50px);}}
  @keyframes armUpR{0%{transform:rotate(0) translateY(0);}100%{transform:rotate(-152deg) translateY(-50px);}}
  /* free arm stops after run */
  .stop .p-arm-l{animation:none;transform:rotate(0);}

  /* bag / black travel bag — carried by ONE hand (right), then placed */
  .bag{
    position:absolute;right:8px;bottom:70px;
    width:96px;height:64px;
    transform:translateY(0) rotate(-10deg);
    animation:bagCarry 0.22s ease-in-out infinite alternate;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,0.45));
    z-index:2;
  }
  @keyframes bagCarry{from{transform:translateY(0) rotate(-10deg);}to{transform:translateY(-5px) rotate(-16deg);}}
  .bag-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,#3a3a40,#19191d);
    border-radius:10px;border:2px solid #000;
  }
  .bag-handle{
    position:absolute;left:50%;bottom:100%;width:32px;height:18px;
    transform:translateX(-50%);
    border:4px solid #000;border-bottom:none;border-radius:8px 8px 0 0;
  }
  .bag-lock{
    position:absolute;left:50%;top:22px;width:24px;height:16px;transform:translateX(-50%);
    background:#c9a227;border-radius:4px;border:1px solid #7a5f14;
  }
  .bag-lock::after{content:'';position:absolute;left:50%;top:3px;width:11px;height:8px;transform:translateX(-50%);background:#e9c65c;border-radius:3px;}
  /* bag placed down after the run */
  .bag.placed{animation:bagPlace 0.55s cubic-bezier(.5,-.4,.3,1.3) forwards;}
  @keyframes bagPlace{
    0%{ transform:translateY(0) rotate(-10deg); }
    60%{ transform:translateY(62px) rotate(4deg); }
    100%{ transform:translateY(62px) rotate(0); }
  }
  /* slight ground dust on bag placement */
  .dust{
    position:absolute;bottom:22px;left:50%;width:8px;height:8px;border-radius:50%;
    background:rgba(62,211,199,0.4);opacity:0;
    transform:translateX(-50%);
  }
  /* intro label */
  .intro-label{
    margin-top:26px;
    font-family:'Space Grotesk',sans-serif;
    color:#7ec9c2;letter-spacing:1px;
    opacity:0;animation:introFade 0.8s ease 0.3s forwards;
  }
  @keyframes introFade{to{opacity:1;}}
  .intro-label span{color:#F2A93B;}

  /* ═══════ LOGIN FORM (opens beside the person) ═══════ */
  .login-form{
    display:flex;flex-direction:column;gap:12px;
    max-width:300px;width:min(300px,80vw);
    padding:20px;
    background:rgba(16,16,20,0.6);
    backdrop-filter:blur(6px);
    border-radius:8px;color:#fff;font-family:Arial;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    z-index:10;
    position:relative;
    opacity:0;visibility:hidden;
    transform:translateX(30px) scale(0.95);
    transition:opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
  }
  .login-form.open{
    opacity:1;visibility:visible;
    transform:translateX(0) scale(1);
  }
  .login-form-title{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:2px;font-family:'Space Grotesk',sans-serif;}
  input,button{padding:10px;border:none;border-radius:5px;}
  input{background:rgba(34,34,38,0.8);color:#fff;border:1px solid #333;outline:none;}
  input:focus{border-color:#F2A93B;}
  button{background:#007bff;color:#fff;cursor:pointer;font-weight:600;}
  button:hover{background:#0056b3;}
  button:disabled{opacity:0.6;cursor:wait;}
  .error{color:#ff6b6b;font-size:0.82rem;display:none;text-align:center;}
  .signup{font-size:0.82rem;text-align:center;color:#888;}
  .signup a{color:#F2A93B;text-decoration:none;font-weight:600;}
  .role-tag{
    text-align:center;font-size:0.72rem;color:#7ec9c2;
    background:rgba(62,211,199,0.1);padding:4px 10px;border-radius:12px;
    margin-bottom:6px;display:inline-block;align-self:center;
  }

  @media (max-width:680px){
    /* stack form below the person on small screens */
    .intro-scene{flex-direction:column;gap:6px;overflow-y:auto;}
    .stage{width:min(300px,86vw);height:280px;}
    .login-form.open{transform:translateX(0) scale(1);}
  }
</style>
</head>
<body>

<!-- INTRO SCENE: person carrying a bag walks in, places it, raises arms, form opens beside -->
<div class="intro-scene" id="introScene">
  <div class="stage">
    <div class="dust"></div>
    <div class="ground"></div>
    <div class="person" id="person">
      <div class="spin-ball"><div class="hair"></div></div>
      <div class="p-spike s1"></div>
      <div class="p-spike s2"></div>
      <div class="p-spike s3"></div>
      <div class="p-head">
        <div class="p-eye p-eye-l"></div>
        <div class="p-eye p-eye-r"></div>
        <div class="p-nose"></div>
      </div>
      <div class="p-belly-hip"></div>
      <div class="p-body"></div>
      <div class="p-arm p-arm-l"></div>
      <div class="p-arm p-arm-r"></div>
      <div class="p-leg p-leg-l"><div class="shoe"></div></div>
      <div class="p-leg p-leg-r"><div class="shoe"></div></div>
      <div class="bag" id="bag">
        <div class="bag-handle"></div>
        <div class="bag-body"></div>
        <div class="bag-lock"></div>
      </div>
    </div>
  </div>

  <!-- LOGIN FORM (opens beside the person) -->
  <form class="login-form" id="loginForm" style="align-self:center;">
    <span class="role-tag">PLATINUMZ IT Support</span>
    <div class="login-form-title">Login</div>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <div class="error" id="loginError"></div>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBPhpL4O8Zfy7InnfKL8neM7hM7sBUQdWY",
  authDomain: "platinumz--it-support.firebaseapp.com",
  projectId: "platinumz--it-support",
  storageBucket: "platinumz--it-support.firebasestorage.app",
  messagingSenderId: "753254762964",
  appId: "1:753254762964:web:e7ee9436a48d3274c42e41"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
var db = firebase.firestore();
var ADMIN_EMAIL = 'paulleonard277@gmail.com';
var _adminRoleCache = {};

function _isAdmin(user){
  if(!user) return false;
  if(user.email === ADMIN_EMAIL) return true;
  return !!_adminRoleCache[user.uid];
}
function _checkAdminRole(user){
  return db.collection('clients').doc(user.uid).get().then(function(doc){
    if(doc.exists && doc.data().role === 'admin'){
      _adminRoleCache[user.uid] = true;
      return true;
    }
    return false;
  }).catch(function(){ return false; });
}
function _route(user){
  _checkAdminRole(user).then(function(){
    window.location.href = _isAdmin(user) ? 'admin.html' : 'customer.html';
  }).catch(function(){
    window.location.href = 'customer.html';
  });
}

/* If already logged in, route immediately (no need for animation) */
auth.onAuthStateChanged(function(user){
  if(user){ _route(user); }
});

/* Intro sequence: walk in -> stop -> place bag on ground -> raise arms -> open form beside */
var formOpened = false;
function openLoginForm(){
  if(formOpened) return;
  formOpened = true;
  var person = document.getElementById('person');
  var bag = document.getElementById('bag');
  var form = document.getElementById('loginForm');
  /* person stops walking */
  person.classList.add('stop');
  /* place the bag down on the ground (drops over 0.55s) */
  bag.classList.add('placed');
  /* after the bag lands, raise arms and open the form beside the person */
  setTimeout(function(){
    person.classList.add('raise');
    form.classList.add('open');
  }, 620);
}

/* timeline:
   1) Sonic spins up into a ball (0 -> 0.7s)
   2) person runs/walks (0.7 -> 2.9s), then we trigger the placing sequence */
window.addEventListener('load', function(){
  var person = document.getElementById('person');
  person.classList.add('spin');
  /* after the spin, switch to the running pose (ball hides, character appears) */
  setTimeout(function(){
    person.classList.remove('spin');
  }, 700);
  setTimeout(openLoginForm, 3000);
});
/* fallback: also trigger if animations are disabled/slow */
setTimeout(openLoginForm, 3700);

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.textContent = 'Logging in...';
  btn.disabled = true;
  auth.signInWithEmailAndPassword(email, pass).then(function(){
    /* routed by onAuthStateChanged */
  }).catch(function(error){
    btn.textContent = 'Login';
    btn.disabled = false;
    var msg = 'Something went wrong.';
    if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') msg='Email or password is incorrect.';
    err.textContent = msg;
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
