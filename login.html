<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PLATINUMZ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family:Arial,sans-serif;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-2;
    background:linear-gradient(160deg,#0E1A2B 0%,#12263a 50%,#0a1826 100%);
  }
  body::after{
    content:'';
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 20% 20%, rgba(62,211,199,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(242,169,59,0.08), transparent 40%);
  }

  /* ═══════ INTRO SCENE ═══════ */
  .intro-scene{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:row;
    align-items:center;justify-content:center;
    gap:clamp(8px,4vw,80px);
    background:transparent;
    padding:20px;
  }
  .stage{
    position:relative;
    width:min(360px,70vw);
    height:340px;
    flex-shrink:0;
  }
  /* ground line */
  .ground{
    position:absolute;left:10%;right:10%;bottom:26px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(62,211,199,0.5),transparent);
  }
  /* character (person) — walks in from the left over ~2.2s, stops in the middle */
  .person{
    position:absolute;bottom:40px;left:50%;
    width:120px;height:180px;
    transform:translateX(-50%);
    animation:personWalk 2.2s ease-in-out forwards;
  }
  @keyframes personWalk{
    0%{ transform:translateX(calc(-50% - 70vw)); }
    70%{ transform:translateX(calc(-50% + 8vw)); }
    100%{ transform:translateX(-50%); }
  }
  /* body */
  .p-body{
    position:absolute;left:35px;bottom:40px;width:50px;height:70px;
    border-radius:18px 18px 8px 8px;
    background:linear-gradient(180deg,#2b6ad8,#1e4fa8);
  }
  /* head with eyes and nose */
  .p-head{
    position:absolute;left:38px;bottom:110px;width:44px;height:44px;border-radius:50%;
    background:linear-gradient(180deg,#f0c39a,#d9a878);
    box-shadow:inset -6px -4px 0 rgba(0,0,0,0.08);
  }
  /* eyes */
  .p-head::before{
    content:'';position:absolute;top:16px;left:10px;width:8px;height:9px;
    border-radius:50%;background:#1c1c24;
  }
  .p-head::after{
    content:'';position:absolute;top:16px;right:10px;width:8px;height:9px;
    border-radius:50%;background:#1c1c24;
  }
  /* nose (small) */
  .p-nose{
    position:absolute;top:26px;left:50%;transform:translateX(-50%);
    width:6px;height:8px;border-radius:50% 50% 60% 60%;
    background:linear-gradient(180deg,#e2b083,#c99666);
  }
  /* legs — realistic walk: legs pass each other (swing out, cross, swing back), then settle */
  .p-leg{position:absolute;bottom:16px;width:12px;height:30px;background:#1c366b;border-radius:4px;}
  .p-leg-l{left:40px;animation:legL 0.44s linear infinite;transform-origin:top;}
  .p-leg-r{left:66px;animation:legR 0.44s linear infinite;transform-origin:top;}
  /* legs stop after the walk */
  .stop .p-leg-l{animation:none;transform:rotate(0);}
  .stop .p-leg-r{animation:none;transform:rotate(0);}
  .stop .p-arm-l{animation:none;transform:rotate(0);}
  @keyframes legL{
    0%,100%{ transform:translateX(-16px) rotate(22deg); }
    50%{ transform:translateX(16px) rotate(-18deg); }
  }
  @keyframes legR{
    0%,100%{ transform:translateX(16px) rotate(-18deg); }
    50%{ transform:translateX(-16px) rotate(22deg); }
  }
  /* arms */
  .p-arm{position:absolute;top:118px;width:12px;height:42px;background:#2b6ad8;border-radius:6px;transform-origin:top;transform:rotate(0);}
  .p-arm-l{left:28px;animation:armSwingL 0.44s linear infinite;}
  .p-arm-r{right:26px;}
  /* free left arm swings while walking; right arm (bag hand) stays steady */
  @keyframes armSwingL{0%,100%{transform:rotate(-16deg);}50%{transform:rotate(14deg);}}
  /* arms raise up after the bag is placed on the ground */
  .raise .p-arm-l{animation:armUpL 0.6s ease-out 0.2s forwards;}
  .raise .p-arm-r{animation:armUpR 0.6s ease-out 0.2s forwards;}
  @keyframes armUpL{
    0%{ transform:rotate(0) translateY(0); }
    100%{ transform:rotate(152deg) translateY(-50px); }
  }
  @keyframes armUpR{
    0%{ transform:rotate(0) translateY(0); }
    100%{ transform:rotate(-152deg) translateY(-50px); }
  }
  /* bag / briefcase — carried by ONE hand (right side), then placed on the ground */
  .bag{
    position:absolute;right:2px;bottom:76px;
    width:96px;height:66px;
    transform:translateY(0) rotate(8deg);
    animation:bagCarry 0.22s ease-in-out infinite alternate;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,0.35));
    z-index:2;
  }
  /* slight swing while walking (bag held by one hand) */
  @keyframes bagCarry{from{transform:translateY(0) rotate(8deg);}to{transform:translateY(-5px) rotate(3deg);}}
  .bag-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,#8a4a2f,#5e2f1c);
    border-radius:10px;
    border:2px solid #3f2012;
  }
  .bag-handle{
    position:absolute;left:50%;bottom:100%;width:30px;height:16px;
    transform:translateX(-50%);
    border:4px solid #5e2f1c;border-bottom:none;border-radius:8px 8px 0 0;
  }
  .bag-lock{
    position:absolute;left:50%;top:24px;width:22px;height:16px;transform:translateX(-50%);
    background:#e2c687;border-radius:4px;border:1px solid #8a6a2f;
  }
  .bag-lock::after{content:'';position:absolute;left:50%;top:3px;width:10px;height:8px;transform:translateX(-50%);background:#f5e3ae;border-radius:3px;}
  /* bag placed down on the ground after the walk (drops 58px to sit beside the feet) */
  .bag.placed{
    animation:bagPlace 0.55s cubic-bezier(.5,-.4,.3,1.3) forwards;
  }
  @keyframes bagPlace{
    0%{ transform:translateY(0) rotate(8deg); }
    60%{ transform:translateY(58px) rotate(-4deg); }
    100%{ transform:translateY(58px) rotate(0); }
  }
  /* slight ground dust on bag placement */
  .dust{
    position:absolute;bottom:22px;left:50%;width:8px;height:8px;border-radius:50%;
    background:rgba(62,211,199,0.4);opacity:0;
    transform:translateX(-50%);
  }
  /* intro label */
  .intro-label{
    margin-top:26px;
    font-family:'Space Grotesk',sans-serif;
    color:#7ec9c2;letter-spacing:1px;
    opacity:0;animation:introFade 0.8s ease 0.3s forwards;
  }
  @keyframes introFade{to{opacity:1;}}
  .intro-label span{color:#F2A93B;}

  /* ═══════ LOGIN FORM (opens beside the person) ═══════ */
  .login-form{
    display:flex;flex-direction:column;gap:12px;
    max-width:300px;width:min(300px,80vw);
    padding:20px;
    background:rgba(16,16,20,0.6);
    backdrop-filter:blur(6px);
    border-radius:8px;color:#fff;font-family:Arial;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    z-index:10;
    position:relative;
    opacity:0;visibility:hidden;
    transform:translateX(30px) scale(0.95);
    transition:opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
  }
  .login-form.open{
    opacity:1;visibility:visible;
    transform:translateX(0) scale(1);
  }
  .login-form-title{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:2px;font-family:'Space Grotesk',sans-serif;}
  input,button{padding:10px;border:none;border-radius:5px;}
  input{background:rgba(34,34,38,0.8);color:#fff;border:1px solid #333;outline:none;}
  input:focus{border-color:#F2A93B;}
  button{background:#007bff;color:#fff;cursor:pointer;font-weight:600;}
  button:hover{background:#0056b3;}
  button:disabled{opacity:0.6;cursor:wait;}
  .error{color:#ff6b6b;font-size:0.82rem;display:none;text-align:center;}
  .signup{font-size:0.82rem;text-align:center;color:#888;}
  .signup a{color:#F2A93B;text-decoration:none;font-weight:600;}
  .role-tag{
    text-align:center;font-size:0.72rem;color:#7ec9c2;
    background:rgba(62,211,199,0.1);padding:4px 10px;border-radius:12px;
    margin-bottom:6px;display:inline-block;align-self:center;
  }

  @media (max-width:680px){
    /* stack form below the person on small screens */
    .intro-scene{flex-direction:column;gap:6px;overflow-y:auto;}
    .stage{width:min(280px,80vw);height:260px;}
    .person{transform:translateX(-50%) scale(0.8);}
    .login-form.open{transform:translateX(0) scale(1);}
  }
</style>
</head>
<body>

<!-- INTRO SCENE: person carrying a bag walks in, places it, raises arms, form opens beside -->
<div class="intro-scene" id="introScene">
  <div class="stage">
    <div class="dust"></div>
    <div class="ground"></div>
    <div class="person" id="person">
      <div class="p-head"><div class="p-nose"></div></div>
      <div class="p-body"></div>
      <div class="p-arm p-arm-l"></div>
      <div class="p-arm p-arm-r"></div>
      <div class="p-leg p-leg-l"></div>
      <div class="p-leg p-leg-r"></div>
      <div class="bag" id="bag">
        <div class="bag-handle"></div>
        <div class="bag-body"></div>
        <div class="bag-lock"></div>
      </div>
    </div>
  </div>

  <!-- LOGIN FORM (opens beside the person) -->
  <form class="login-form" id="loginForm" style="align-self:center;">
    <span class="role-tag">PLATINUMZ IT Support</span>
    <div class="login-form-title">Login</div>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <div class="error" id="loginError"></div>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBPhpL4O8Zfy7InnfKL8neM7hM7sBUQdWY",
  authDomain: "platinumz--it-support.firebaseapp.com",
  projectId: "platinumz--it-support",
  storageBucket: "platinumz--it-support.firebasestorage.app",
  messagingSenderId: "753254762964",
  appId: "1:753254762964:web:e7ee9436a48d3274c42e41"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
var db = firebase.firestore();
var ADMIN_EMAIL = 'paulleonard277@gmail.com';
var _adminRoleCache = {};

function _isAdmin(user){
  if(!user) return false;
  if(user.email === ADMIN_EMAIL) return true;
  return !!_adminRoleCache[user.uid];
}
function _checkAdminRole(user){
  return db.collection('clients').doc(user.uid).get().then(function(doc){
    if(doc.exists && doc.data().role === 'admin'){
      _adminRoleCache[user.uid] = true;
      return true;
    }
    return false;
  }).catch(function(){ return false; });
}
function _route(user){
  _checkAdminRole(user).then(function(){
    window.location.href = _isAdmin(user) ? 'admin.html' : 'customer.html';
  }).catch(function(){
    window.location.href = 'customer.html';
  });
}

/* If already logged in, route immediately (no need for animation) */
auth.onAuthStateChanged(function(user){
  if(user){ _route(user); }
});

/* Intro sequence: walk in -> stop -> place bag on ground -> raise arms -> open form beside */
var formOpened = false;
function openLoginForm(){
  if(formOpened) return;
  formOpened = true;
  var person = document.getElementById('person');
  var bag = document.getElementById('bag');
  var form = document.getElementById('loginForm');
  /* person stops walking */
  person.classList.add('stop');
  /* place the bag down on the ground (drops over 0.55s) */
  bag.classList.add('placed');
  /* after the bag lands, raise arms and open the form beside the person */
  setTimeout(function(){
    person.classList.add('raise');
    form.classList.add('open');
  }, 620);
}

/* timeline:
   person walks 0 -> 2.2s, then we trigger the placing sequence */
window.addEventListener('load', function(){
  setTimeout(openLoginForm, 2300);
});
/* fallback: also trigger if animations are disabled/slow */
setTimeout(openLoginForm, 3000);

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.textContent = 'Logging in...';
  btn.disabled = true;
  auth.signInWithEmailAndPassword(email, pass).then(function(){
    /* routed by onAuthStateChanged */
  }).catch(function(error){
    btn.textContent = 'Login';
    btn.disabled = false;
    var msg = 'Something went wrong.';
    if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') msg='Email or password is incorrect.';
    err.textContent = msg;
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
