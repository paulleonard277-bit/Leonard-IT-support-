<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — PLATINUMZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --fg:#f4f4f5;
    --muted:#8b8b94;
    --line:rgba(255,255,255,0.08);
    --line2:rgba(255,255,255,0.12);
    --accent:#2be3a8;
    --accent2:#1de9a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* soft studio glow behind everything */
  .backdrop{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg);}
  .backdrop::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(620px 480px at 50% -18%, rgba(43,227,168,0.10), transparent 60%),
      radial-gradient(700px 520px at 85% 110%, rgba(99,102,241,0.07), transparent 60%),
      radial-gradient(520px 420px at 8% 100%, rgba(29,233,168,0.05), transparent 60%);
  }
  .backdrop::after{
    content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
    mask-image:radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
  }
  .blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none;}
  .blob.b1{width:420px;height:420px;top:-160px;left:50%;transform:translateX(-50%);background:rgba(43,227,168,0.10);animation:blobA 18s ease-in-out infinite;}
  .blob.b2{width:360px;height:360px;bottom:-140px;right:-80px;background:rgba(99,102,241,0.09);animation:blobB 22s ease-in-out infinite;}
  @keyframes blobA{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}50%{transform:translateX(-44%) translateY(24px) scale(1.15)}}
  @keyframes blobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-20px) scale(1.1)}}

  .auth-shell{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}

  /* brand mark */
  .brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px;}
  .brand-logo{
    width:44px;height:44px;border-radius:13px;font-family:'Space Grotesk',sans-serif;
    font-size:1.2rem;font-weight:700;color:#0a0a0b;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 24px rgba(43,227,168,0.25);
    opacity:0;transform:translateY(-8px);
    animation:rise 0.6s cubic-bezier(.22,.61,.36,1) 0.05s forwards;
  }
  .brand-name{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.95rem;letter-spacing:2.5px;color:var(--fg);
    text-align:center;opacity:0;transform:translateY(-8px);
    animation:rise 0.6s cubic-bezier(.22,.61,.36,1) 0.12s forwards;
  }
  .brand-name small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:0.6rem;letter-spacing:3px;color:var(--muted);margin-top:4px;}

  /* card */
  .auth-card{
    width:min(400px,100%);
    background:rgba(255,255,255,0.028);
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 32px 28px;
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    box-shadow:0 24px 90px rgba(0,0,0,0.5);
    opacity:0;transform:translateY(14px);
    animation:rise 0.7s cubic-bezier(.22,.61,.36,1) 0.2s forwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .auth-head h1{font-size:1.3rem;font-weight:600;letter-spacing:-0.01em;}
  .auth-head p{color:var(--muted);font-size:0.86rem;margin-top:6px;line-height:1.5;}

  form{margin-top:26px;display:flex;flex-direction:column;gap:6px;}

  .g-field{display:flex;flex-direction:column;gap:6px;}
  .g-field label{font-size:0.72rem;font-weight:500;color:var(--muted);letter-spacing:0.2px;}
  .g-field input{
    height:44px;padding:0 14px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line2);
    border-radius:11px;color:var(--fg);outline:none;font-size:0.9rem;
    transition:border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .g-field input::placeholder{color:#57575f;}
  .g-field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(43,227,168,0.14);
    background:rgba(255,255,255,0.05);
  }
  #loginName,#loginPass2{display:none;}
  .auth-card.signup-mode #loginName,.auth-card.signup-mode #loginPass2{display:flex;}

  .g-error{color:#ff6b6b;font-size:0.78rem;display:none;text-align:center;margin-top:4px;min-height:0;}

  .g-btn{
    height:44px;margin-top:14px;border:none;border-radius:11px;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:600;color:#04140e;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 26px rgba(43,227,168,0.22);
    transition:filter 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .g-btn:hover{filter:brightness(1.08);box-shadow:0 10px 34px rgba(43,227,168,0.32);}
  .g-btn:active{transform:scale(0.985);}
  .g-btn:disabled{opacity:0.55;cursor:wait;filter:none;}

  .divider{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--muted);font-size:0.7rem;letter-spacing:1px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

  .oauth{
    width:100%;height:44px;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,0.04);border:1px solid var(--line2);color:var(--fg);
    display:flex;align-items:center;justify-content:center;gap:10px;font-size:0.85rem;font-weight:500;
    transition:background 0.2s, border-color 0.2s;
  }
  .oauth:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.2);}
  .oauth:active{transform:scale(0.99);}
  .oauth svg{width:18px;height:18px;}

  .g-signup{font-size:0.8rem;text-align:center;color:var(--muted);margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  .g-signup a{color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none;transition:color 0.15s;}
  .g-signup a:hover{color:var(--accent);}

  .auth-foot{margin-top:34px;color:#4b4b52;font-size:0.68rem;letter-spacing:0.4px;text-align:center;line-height:1.7;}
  .auth-foot span{color:#6b6b73;}
  .auth-foot svg{width:11px;height:11px;vertical-align:-1px;margin:0 2px;}

  @media (prefers-reduced-motion: reduce){
    .blob,.brand-logo,.brand-name,.auth-card{animation:none !important;opacity:1 !important;transform:none !important;}
  }
</style>
</head>
<body>

<div class="backdrop"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="auth-shell">

  <div class="brand">
    <div class="brand-logo">P</div>
    <div class="brand-name">PLATINUMZ<small>IT SUPPORT &amp; SOLUTIONS</small></div>
  </div>

  <div class="auth-card" id="loginFormWrap">
    <div class="auth-head">
      <h1>Karibu tena</h1>
      <p>Ingia kwenye akaunti yako kuendelea na shughuli.</p>
    </div>

    <form id="loginForm">
      <div class="g-field" id="lgNameField"><label>Jina lako</label><input class="f-input" type="text" id="loginName" placeholder="Jina lako (kwa kujisajili)" autocomplete="name"></div>
      <div class="g-field"><label>Barua pepe</label><input class="f-input" type="email" id="loginEmail" placeholder="name@example.com" required></div>
      <div class="g-field"><label>Nenosiri</label><input class="f-input" type="password" id="loginPass" placeholder="Nenosiri lako" required></div>
      <div class="g-field" id="lgPass2Field"><label>Rudia nenosiri</label><input class="f-input" type="password" id="loginPass2" placeholder="Rudia nenosiri" autocomplete="new-password"></div>
      <div class="g-error" id="loginError"></div>
      <button class="g-btn" type="submit" id="loginBtn">Endelea</button>
    </form>

    <div class="divider">AU</div>

    <button class="oauth" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18A10.97 10.97 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l2.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Endelea na Google
    </button>

    <p class="g-signup" id="switchModeText">Huna akaunti? <a id="switchModeLink">Jiandikishe</a></p>
  </div>

  <div class="auth-foot">
    <span>© 2026 PLATINUMZ IT Support — Inalindwa na <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg> Firebase Auth</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBPhpL4O8Zfy7InnfKL8neM7hM7sBUQdWY",
  authDomain: "platinumz--it-support.firebaseapp.com",
  projectId: "platinumz--it-support",
  storageBucket: "platinumz--it-support.firebasestorage.app",
  messagingSenderId: "753254762964",
  appId: "1:753254762964:web:e7ee9436a48d3274c42e41"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
var db = firebase.firestore();
var ADMIN_EMAIL = 'paulleonard277@gmail.com';
var _adminRoleCache = {};

function _isAdmin(user){
  if(!user) return false;
  if(user.email === ADMIN_EMAIL) return true;
  return !!_adminRoleCache[user.uid];
}
function _checkAdminRole(user){
  return db.collection('clients').doc(user.uid).get().then(function(doc){
    if(doc.exists && doc.data().role === 'admin'){
      _adminRoleCache[user.uid] = true;
      return true;
    }
    return false;
  }).catch(function(){ return false; });
}
function _route(user){
  var v = 'v=' + Date.now();
  _checkAdminRole(user).then(function(){
    window.location.href = (_isAdmin(user) ? 'admin.html' : 'customer.html') + '?' + v;
  }).catch(function(){
    window.location.href = 'customer.html?' + v;
  });
}

/* If already logged in, route immediately */
auth.onAuthStateChanged(function(user){
  if(user){ _route(user); }
});

/* switch between Login and Signup modes */
var authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  var wrap = document.getElementById('loginFormWrap');
  var btn = document.getElementById('loginBtn');
  var sw = document.getElementById('switchModeText');
  var err = document.getElementById('loginError');
  err.style.display = 'none';
  if(mode === 'signup'){
    wrap.classList.add('signup-mode');
    btn.textContent = 'Jiandikishe';
    sw.innerHTML = 'Una akaunti? <a id="switchModeLink">Ingia</a>';
  } else {
    wrap.classList.remove('signup-mode');
    btn.textContent = 'Endelea';
    sw.innerHTML = 'Huna akaunti? <a id="switchModeLink">Jiandikishe</a>';
  }
  document.getElementById('switchModeLink').addEventListener('click', function(){
    setAuthMode(authMode === 'login' ? 'signup' : 'login');
  });
}

document.getElementById('googleBtn').addEventListener('click', function(){
  var err = document.getElementById('loginError');
  err.textContent = 'Google sign-in inakaribishwa hivi karibuni. Tumia email na nenosiri.';
  err.style.display = 'block';
});

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var name = document.getElementById('loginName').value.trim();
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.disabled = true;

  var action;
  if(authMode === 'signup'){
    var pass2 = document.getElementById('loginPass2').value;
    if(pass.length < 6){
      err.textContent = 'Nenosiri lazima liwe angalau herufi 6.';
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
    if(pass !== pass2){
      err.textContent = 'Nenosiri hazifanani.';
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
    btn.textContent = 'Inajisajili...';
    action = auth.createUserWithEmailAndPassword(email, pass);
  } else {
    btn.textContent = 'Inaingia...';
    action = auth.signInWithEmailAndPassword(email, pass);
  }

  action.then(function(result){
    if(authMode === 'signup' && result.user){
      var tasks = [];
      if(name) tasks.push(result.user.updateProfile({ displayName: name }));
      tasks.push(db.collection('clients').doc(result.user.uid).set({
        jina: name || '',
        email: email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }));
      tasks.push(result.user.sendEmailVerification());
      return Promise.all(tasks);
    }
    return null;
  }).then(function(){
    /* routed by onAuthStateChanged */
  }).catch(function(error){
    btn.textContent = authMode === 'signup' ? 'Jiandikishe' : 'Endelea';
    btn.disabled = false;
    var msg = 'Kuna tatizo. Jaribu tena.';
    if(error.code==='auth/email-already-in-use') msg='Email hii tayari imetumika.';
    else if(error.code==='auth/invalid-email') msg='Email si sahihi.';
    else if(error.code==='auth/weak-password') msg='Nenosiri ni dhaifu sana.';
    else if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') msg='Email au nenosiri si sahihi.';
    err.textContent = msg;
    err.style.display = 'block';
  });
});

setAuthMode('login');
</script>
</body>
</html>
